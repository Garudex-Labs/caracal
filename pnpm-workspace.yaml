packages:
  - 'apps/*'
  - 'docs'
  - 'services/*'
  - 'packages/core/ts'
  - 'packages/serverCore/ts'
  - 'packages/identity/ts'
  - 'packages/revocation/ts'
  - 'packages/oauth/ts'
  - 'packages/adminAudit/ts'
  - 'packages/verify/ts'
  - 'packages/sdk/ts'
  - 'packages/admin/ts'
  - 'packages/engine'
  - 'packages/adapters/express/ts'
  - 'packages/adapters/fastmcp/ts'
  - 'packages/backends/redis/ts'
linkWorkspacePackages: true
allowBuilds:
  bun: true
  esbuild: true
  sharp: true
overrides:
  brace-expansion: 5.0.9
  minimatch@3>brace-expansion: 2.1.2
  fast-uri: 3.1.5
  '@fastify/static': 10.1.2
  devalue: 5.8.1
  qs: 6.15.2
  vite: 8.0.16
  dompurify: 3.4.13
  esbuild: 0.28.1
  js-yaml: 4.3.1
  mermaid: ^11.16.1
  read-yaml-file: ^2.1.0
  '@opentelemetry/core': 2.8.0
