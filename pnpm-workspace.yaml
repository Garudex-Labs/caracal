packages:
  - 'apps/*'
  - 'docs'
  - 'services/*'
  - 'packages/core/ts'
  - 'packages/serverCore/ts'
  - 'packages/identity/ts'
  - 'packages/revocation/ts'
  - 'packages/oauth/ts'
  - 'packages/adminAudit/ts'
  - 'packages/verify/ts'
  - 'packages/sdk/ts'
  - 'packages/admin/ts'
  - 'packages/engine'
  - 'packages/adapters/express/ts'
  - 'packages/adapters/fastmcp/ts'
  - 'packages/backends/redis/ts'
linkWorkspacePackages: true
allowBuilds:
  bun: true
  esbuild: true
  sharp: true
overrides:
  brace-expansion: 5.0.12
  minimatch@3>brace-expansion: 2.1.7
  fast-uri: 3.1.8
  '@fastify/static': 10.1.2
  devalue: 5.9.3
  qs: 6.16.0
  vite: 8.0.16
  dompurify: 3.4.16
  esbuild: 0.28.1
  js-yaml: 4.3.2
  http-cache-semantics: 4.3.0
  "undici@^7": 7.29.1
  "undici@^8": 8.10.2
  mermaid: ^11.16.1
  read-yaml-file: ^2.1.0
  '@opentelemetry/core': 2.8.0
