apiVersion: v1
kind: Service
metadata:
  name: {{ include "caracal.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "caracal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    {{- include "caracal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
