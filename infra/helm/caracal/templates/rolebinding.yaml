{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "caracal.fullname" . }}-init-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "caracal.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "caracal.fullname" . }}-init-role
subjects:
  - kind: ServiceAccount
    name: {{ include "caracal.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
