apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "caracal.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "caracal.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  accessModes: [ "ReadWriteOnce" ]
  {{- if .Values.api.storage.storageClassName }}
  storageClassName: {{ .Values.api.storage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.storage.size | quote }}
