{{- if not .Values.secrets.existingSecret }}
{{- $secretName := include "caracal.secretName" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $pgPass := "" }}
{{- $chPass := "" }}
{{- $secKey := "" }}
{{- $authSecret := "" }}
{{- $betterAuthSecret := "" }}
{{- $dbUrl := "" }}
{{- $chUrl := "" }}
{{- $redisUrl := "" }}
{{- if and $existingSecret $existingSecret.data }}
  {{- $pgPass = index $existingSecret.data "POSTGRES_PASSWORD" | b64dec }}
  {{- $chPass = index $existingSecret.data "CLICKHOUSE_PASSWORD" | b64dec }}
  {{- $secKey = index $existingSecret.data "SECRET_KEY" | b64dec }}
  {{- if hasKey $existingSecret.data "AUTH_INTERNAL_SECRET" }}
    {{- $authSecret = index $existingSecret.data "AUTH_INTERNAL_SECRET" | b64dec }}
  {{- else }}
    {{- $authSecret = .Values.secrets.authInternalSecret | default (randAlphaNum 32) }}
  {{- end }}
  {{- if hasKey $existingSecret.data "BETTER_AUTH_SECRET" }}
    {{- $betterAuthSecret = index $existingSecret.data "BETTER_AUTH_SECRET" | b64dec }}
  {{- else }}
    {{- $betterAuthSecret = .Values.secrets.betterAuthSecret | default (randAlphaNum 32) }}
  {{- end }}
{{- else }}
  {{- $pgPass = .Values.secrets.postgresPassword | default (randAlphaNum 24) }}
  {{- $chPass = .Values.secrets.clickhousePassword | default (randAlphaNum 24) }}
  {{- $secKey = .Values.secrets.secretKey | default (randAlphaNum 32) }}
  {{- $authSecret = .Values.secrets.authInternalSecret | default (randAlphaNum 32) }}
  {{- $betterAuthSecret = .Values.secrets.betterAuthSecret | default (randAlphaNum 32) }}
{{- end }}
{{- if .Values.postgresql.enabled }}
  {{- $dbUrl = printf "postgresql://postgres:%s@%s-db:5432/caracal" $pgPass (include "caracal.fullname" .) }}
{{- else }}
  {{- $dbUrl = required "postgresql.externalUrl is required when postgresql.enabled=false" .Values.postgresql.externalUrl }}
{{- end }}
{{- if .Values.clickhouse.enabled }}
  {{- $chUrl = printf "clickhouse://default:%s@%s-clickhouse:8123/caracal" $chPass (include "caracal.fullname" .) }}
{{- else }}
  {{- $chUrl = required "clickhouse.externalUrl is required when clickhouse.enabled=false" .Values.clickhouse.externalUrl }}
{{- end }}
{{- if .Values.redis.enabled }}
  {{- $redisUrl = printf "redis://%s-redis:6379" (include "caracal.fullname" .) }}
{{- else }}
  {{- $redisUrl = required "redis.externalUrl is required when redis.enabled=false" .Values.redis.externalUrl }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "caracal.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "caracal.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ $secKey | quote }}
  AUTH_INTERNAL_SECRET: {{ $authSecret | quote }}
  BETTER_AUTH_SECRET: {{ $betterAuthSecret | quote }}
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
  CLICKHOUSE_PASSWORD: {{ $chPass | quote }}
  CARACAL_POSTGRES_URL: {{ $dbUrl | quote }}
  CARACAL_CLICKHOUSE_URL: {{ $chUrl | quote }}
  CARACAL_REDIS_URL: {{ $redisUrl | quote }}
  # The identity service's pg driver reads the same relational store.
  DATABASE_URL: {{ $dbUrl | quote }}
{{- end }}
