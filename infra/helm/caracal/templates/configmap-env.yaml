apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caracal.configMapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "caracal.labels" . | nindent 4 }}
data:
  {{- $authURL := .Values.config.authServiceUrl | default (printf "http://%s-auth:8001" (include "caracal.fullname" .)) }}
  CARACAL_AUTH_SERVICE_URL: {{ $authURL | quote }}
  CARACAL_JWKS_URL: {{ .Values.config.jwksUrl | default (printf "%s/api/auth/jwks" $authURL) | quote }}
  CARACAL_JWT_ISSUER: {{ .Values.config.jwtIssuer | quote }}
  CARACAL_JWT_AUDIENCE: {{ .Values.config.jwtAudience | quote }}
