apiVersion: v1
kind: Service
metadata:
  name: {{ include "caracal.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "caracal.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  selector:
    {{- include "caracal.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
  ports:
    - port: 8001
      targetPort: 8001
      name: http
