apiVersion: 1

datasources:
  - name: Caracal ClickHouse
    type: grafana-clickhouse-datasource
    uid: caracal-clickhouse
    access: proxy
    isDefault: true
    jsonData:
      host: caracal-clickhouse
      port: 8123
      protocol: http
      defaultDatabase: caracal
      username: default
    secureJsonData:
      password: $CLICKHOUSE_PASSWORD
    editable: true
