# Standalone Caracal deployment - uses pre-built images from GHCR.
# Generated for curl-install: no source code or build context required.

services:
  caracal-init:
    image: ghcr.io/garudex-labs/caracal-server:${CARACAL_VERSION:-latest}
    command: ["init"]
    env_file:
      - ./.env
    group_add:
      - "${CARACAL_SECRET_GID:-1000}"
    depends_on:
      caracal-db:
        condition: service_healthy
      caracal-clickhouse:
        condition: service_healthy
      caracal-redis:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - caracal-net

  caracal-server:
    image: ghcr.io/garudex-labs/caracal-server:${CARACAL_VERSION:-latest}
    env_file:
      - ./.env
    group_add:
      - "${CARACAL_SECRET_GID:-1000}"
    environment:
      - CARACAL_CLICKHOUSE_URL_FILE=/run/secrets/clickhouse_url
      - CARACAL_REDIS_URL_FILE=/run/secrets/redis_url
      - CARACAL_POSTGRES_URL_FILE=/run/secrets/database_url
      - CARACAL_JWKS_URL=http://caracal-auth:8001/api/auth/jwks
      - CARACAL_JWT_ISSUER=${BETTER_AUTH_URL:-http://localhost}
      - CARACAL_JWT_AUDIENCE=caracal-api
      - CARACAL_AUTH_SERVICE_URL=http://caracal-auth:8001
      - AUTH_INTERNAL_SECRET_FILE=/run/secrets/auth_internal_secret
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      caracal-init:
        condition: service_completed_successfully
      caracal-clickhouse:
        condition: service_healthy
      caracal-redis:
        condition: service_healthy
      caracal-auth:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - caracal-net

  caracal-auth:
    image: ghcr.io/garudex-labs/caracal-auth:${CARACAL_VERSION:-latest}
    group_add:
      - "${CARACAL_SECRET_GID:-1000}"
    environment:
      - NODE_ENV=production
      - AUTH_PORT=8001
      - DATABASE_URL_FILE=/run/secrets/auth_database_url
      - BETTER_AUTH_SECRET_FILE=/run/secrets/better_auth_secret
      - AUTH_INTERNAL_SECRET_FILE=/run/secrets/auth_internal_secret
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost}
      - AUTH_TRUSTED_ORIGINS=${AUTH_TRUSTED_ORIGINS:-http://localhost}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET_FILE=${GOOGLE_CLIENT_SECRET_FILE:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET_FILE=${GITHUB_CLIENT_SECRET_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      caracal-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:8001/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - caracal-net

  caracal-db:
    image: postgres:18
    group_add:
      - "${CARACAL_SECRET_GID:-1000}"
    ports:
      - "${CARACAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: caracal
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./secrets/postgres:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - caracal-net

  caracal-clickhouse:
    image: clickhouse/clickhouse-server:26.6
    group_add:
      - "${CARACAL_SECRET_GID:-1000}"
    ports:
      - "${CARACAL_BIND_ADDRESS:-127.0.0.1}:${CLICKHOUSE_HOST_PORT:-8123}:8123"
    environment:
      MAX_SERVER_MEMORY_USAGE_RATIO: "0.8"
      HEALTHCHECK_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./clickhouse/users.d:/etc/clickhouse-server/users.d:ro
      - ./secrets/clickhouse:/run/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -s /run/secrets/clickhouse_password ]; then clickhouse-client --password \"$$(cat /run/secrets/clickhouse_password)\" --query 'SELECT 1'; else clickhouse-client --password \"$${HEALTHCHECK_CLICKHOUSE_PASSWORD:-clickhouse}\" --query 'SELECT 1'; fi",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEMORY_LIMIT:-2G}
    networks:
      - caracal-net

  caracal-redis:
    image: redis:8-alpine
    ports:
      - "${CARACAL_BIND_ADDRESS:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - caracal-net

  caracal-web:
    image: ghcr.io/garudex-labs/caracal-web:${CARACAL_VERSION:-latest}
    ports:
      - "${CARACAL_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-8000}:8000"
    depends_on:
      caracal-lb:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/log/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - caracal-net

  caracal-lb:
    image: nginx:alpine
    ports:
      - "${CARACAL_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      caracal-server:
        condition: service_started
      caracal-auth:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - caracal-net


volumes:
  pgdata:
  chdata:
  redisdata:
  apidata:

networks:
  caracal-net:
    driver: bridge
