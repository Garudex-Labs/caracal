services:
  caracal-prometheus:
    image: prom/prometheus:v3.12.0
    ports:
      - "${CARACAL_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      caracal-server:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - caracal-net

  caracal-grafana:
    profiles: ["grafana"]
    image: grafana/grafana-oss:13.0.2
    group_add:
      - "${CARACAL_SECRET_GID:-1000}"
    ports:
      - "${CARACAL_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_HOST_PORT:-8002}:3000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$${GRAFANA_ADMIN_PASSWORD_FILE:-}" ]; then
          export GF_SECURITY_ADMIN_PASSWORD="$$(cat "$$GRAFANA_ADMIN_PASSWORD_FILE")"
        fi
        if [ -n "$${GRAFANA_CLICKHOUSE_PASSWORD_FILE:-}" ]; then
          export CLICKHOUSE_PASSWORD="$$(cat "$$GRAFANA_CLICKHOUSE_PASSWORD_FILE")"
        fi
        exec /run.sh
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GRAFANA_ADMIN_PASSWORD_FILE=${GRAFANA_ADMIN_PASSWORD_FILE:-}
      - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse}
      - GRAFANA_CLICKHOUSE_PASSWORD_FILE=${GRAFANA_CLICKHOUSE_PASSWORD_FILE:-}
    volumes:
      - ./secrets/grafana:/run/secrets:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      caracal-clickhouse:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - caracal-net

volumes:
  grafanadata:
