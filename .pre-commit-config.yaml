repos:

  # ── YAML / TOML / JSON ────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^infra/helm/.*/templates/.*
      - id: check-toml
      - id: check-json
        exclude: tsconfig\.json  # tsconfig allows comments
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
        # Intentional fixtures: redaction unit tests and secret-scrubbing goldens.
        exclude: ^(internal/redact/redact_test\.go|contracts/session-goldens/secrets/input\.jsonl)$

  # ── Secrets / .env guard ───────────────────────────────
  - repo: local
    hooks:
      - id: check-secrets
        name: check for secrets and .env files
        entry: tools/check_secrets.sh
        language: script
        pass_filenames: false

  # ── SPDX copyright update ──────────────────────────────────────
  - repo: local
    hooks:
      - id: spdx-update
        name: add committer copyright to SPDX headers
        entry: go run ./tools/spdxcopyright
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

  # ── Docker ─────────────────────────────────────────────
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        # DL3008/DL3013/DL3018: no version pinning for apt/pip/apk packages.
        args: [--ignore, DL3008, --ignore, DL3013, --ignore, DL3018]
