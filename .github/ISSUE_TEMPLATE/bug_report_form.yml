name: Bug
description: Report a reproducible problem
type: Bug
labels: ["Needs Triage"]

body:
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate check
      options:
        - label: I have searched existing issues and this is not a duplicate
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps or commands that reliably reproduces the issue.
      placeholder: |
        1. Run `...`
        2. Configure `...`
        3. Observe `...`
    validations:
      required: true

  - type: textarea
    id: behaviour
    attributes:
      label: Expected vs actual behaviour
      description: What did you expect to happen, and what happened instead?
      placeholder: |
        Expected:
        ...

        Actual:
        ...
    validations:
      required: true

  - type: textarea
    id: support_bundle
    attributes:
      label: Support bundle
      description: |
        Attach a support bundle if available.

        Generate with `caracal support bundle`.
        Inspect before sharing with `caracal support inspect <bundle.tar.gz>`.
      placeholder: Drag and drop the `.tar.gz` file here, or paste the inspection output.

  - type: textarea
    id: extra_info
    attributes:
      label: Additional context
      description: Include anything else that may help diagnose the issue, such as logs, error messages, environment details, or whether the issue is intermittent.
      placeholder: |
        Version:
        OS:
        Logs/errors:
        Frequency:
        Other context:
