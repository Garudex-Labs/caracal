coverage:
  status:
    # Informational only: coverage reports are tracked but never block a PR.
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 80%
        informational: true

# CI skips the Go or web job when a change does not touch that language, so
# each flag carries its last report forward instead of reading as a drop.
flags:
  go:
    paths:
      - "cmd/"
      - "internal/"
      - "packages/harness-data/"
    carryforward: true
  web:
    paths:
      - "apps/web/src/"
    carryforward: true

ignore:
  - "tests/"
  - "**/*_test.go"
  - "tools/"            # repo tooling, not shipped
  - "contracts/"        # frozen wire fixtures
  - "infra/"
  - "apps/web/src/routeTree.gen.ts" # generated by TanStack Router
  - "apps/web/mock/"    # dev-only mock API
  - "apps/web/src/components/ui/"  # vendored shadcn primitives
