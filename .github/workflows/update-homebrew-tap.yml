# Updates the Garudex-Labs/homebrew-caracal tap after every published release.
#
# Fires when a GitHub release is published (the release.yml workflow flips a
# draft to published as its final step). Downloads the just-published binaries
# from the release, reads their sha256s from checksums.txt, rewrites
# Formula/caracal-cli.rb in the tap, and pushes a commit.

name: Update Homebrew tap

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to the tap (e.g. 0.6.0). Must match an existing GitHub release."
        required: true
        type: string

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-tap:
    name: Bump caracal-cli.rb in homebrew-caracal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pushing to the tap needs the release app credentials, which exist only in
    # the canonical repository.
    if: >-
      github.repository == 'Garudex-Labs/caracal' &&
      (github.event_name == 'workflow_dispatch' || !github.event.release.prerelease)
    steps:
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # Version strings feed shell commands and the formula rewrite below.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]] || {
            echo "::error::Invalid version: $VERSION"
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt \
            --output checksums.txt

      - name: Extract sha256 values
        id: sha
        run: |
          MACOS_ARM=$(grep " caracal-macos-arm64$" checksums.txt | awk '{print $1}')
          LINUX_ARM=$(grep " caracal-linux-arm64$" checksums.txt | awk '{print $1}')
          LINUX_X64=$(grep " caracal-linux-x64$" checksums.txt | awk '{print $1}')

          for var in MACOS_ARM LINUX_ARM LINUX_X64; do
            val="${!var}"
            if [ -z "$val" ]; then
              echo "::error::Missing sha256 for $var in checksums.txt"
              exit 1
            fi
          done

          echo "macos_arm=$MACOS_ARM" >> "$GITHUB_OUTPUT"
          echo "linux_arm=$LINUX_ARM" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$LINUX_X64" >> "$GITHUB_OUTPUT"

      - name: Generate tap app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Garudex-Labs
          repositories: homebrew-caracal

      - name: Checkout homebrew-caracal
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Garudex-Labs/homebrew-caracal
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-caracal

      - name: Rewrite Formula/caracal-cli.rb
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_ARM: ${{ steps.sha.outputs.macos_arm }}
          LINUX_ARM: ${{ steps.sha.outputs.linux_arm }}
          LINUX_X64: ${{ steps.sha.outputs.linux_x64 }}
        run: |
          FORMULA=homebrew-caracal/Formula/caracal-cli.rb

          python3 - <<'PY'
          import os, re, pathlib
          path = pathlib.Path("homebrew-caracal/Formula/caracal-cli.rb")
          text = path.read_text()

          version = os.environ["VERSION"]
          shas = {
              "caracal-macos-arm64": os.environ["MACOS_ARM"],
              "caracal-linux-arm64": os.environ["LINUX_ARM"],
              "caracal-linux-x64":   os.environ["LINUX_X64"],
          }

          text = re.sub(r'^(\s*version\s+)"[^"]+"', rf'\1"{version}"', text, count=1, flags=re.M)
          text = re.sub(
              r'(releases/download/)v[0-9][0-9A-Za-z.\-]*(/caracal-[^"]+)',
              rf'\1v{version}\2',
              text,
          )

          def replace_sha(match):
              url_line, sha_indent = match.group(1), match.group(2)
              binary = re.search(r'/(caracal-[a-z0-9\-]+)"', url_line).group(1)
              new_sha = shas[binary]
              return f'{url_line}\n{sha_indent}sha256 "{new_sha}"'

          text = re.sub(
              r'(url "https://github\.com/Garudex-Labs/caracal/releases/download/v[^"]+")\n(\s*)sha256 "[0-9a-f]{64}"',
              replace_sha,
              text,
          )

          path.write_text(text)
          PY

          echo "--- Updated formula ---"
          cat "$FORMULA"

      - name: Commit and push
        working-directory: homebrew-caracal
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "caracal-release[bot]"
          git config user.email "caracal-release[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Formula already up-to-date for v${VERSION} - nothing to push."
            exit 0
          fi

          git add Formula/caracal-cli.rb
          git commit -m "caracal-cli ${VERSION}"
          git push
