# CodeQL security analysis workflow for Go, Python, and TypeScript sources.

name: "CodeQL Analysis"

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
  schedule:
    - cron: '0 4 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26'

jobs:
  setLanguages:
    name: Select languages
    if: github.repository == 'Garudex-Labs/caracal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.select.outputs.languages }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed languages
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            echo 'languages=["go","python","javascript-typescript"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed.txt
          go=false
          python=false
          ts=false
          # bash case patterns are not pathname-aware: * matches across '/', so
          # these globs intentionally over-match and analyze an extra language
          # rather than skip one that changed.
          while IFS= read -r path; do
            case "$path" in
              *.go|go.work|go.work.sum|*go.mod|*go.sum) go=true ;;
            esac
            case "$path" in
              *.py|*pyproject.toml|scripts/pythonStyleRequirements.*|scripts/pythonTestRequirements.*) python=true ;;
            esac
            case "$path" in
              *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|package.json|pnpm-lock.yaml|pnpm-workspace.yaml) ts=true ;;
            esac
          done < changed.txt

          langs=()
          [[ "$go" == true ]] && langs+=('"go"')
          [[ "$python" == true ]] && langs+=('"python"')
          [[ "$ts" == true ]] && langs+=('"javascript-typescript"')
          if [[ ${#langs[@]} -eq 0 ]]; then
            langs=('"go"' '"python"' '"javascript-typescript"')
          fi
          joined=$(IFS=,; echo "${langs[*]}")
          echo "languages=[${joined}]" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: setLanguages
    if: github.repository == 'Garudex-Labs/caracal'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.setLanguages.outputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
