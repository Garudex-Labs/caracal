#
# Manually triggered deployment of a published Caracal release to Azure.

# Deployment is deliberately manual. This workflow never runs on push, merge, or
# release: an operator selects a published version and an action. Nothing is
# built here. Every artifact is resolved from an existing release, so the
# deployment consumes exactly what users consume.

name: deployAzure

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Published release tag to deploy, for example v1.0.0-rc.1'
        required: true
        type: string
      environment:
        description: 'Environment to act on'
        required: true
        type: choice
        options:
          - production
      action:
        description: 'What to do with that version'
        required: true
        type: choice
        options:
          - deploy
          - verify
          - destroy

permissions:
  contents: read

concurrency:
  group: deploy-azure-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.1.1'

jobs:
  deploy:
    name: ${{ inputs.action }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Requires a reviewer on the environment so a production change is never one
    # click, and holds the Azure federated-credential subject.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Anchored so the tag is the whole value. A case glob ends in `*`, which
      # also matches a newline, and the version is spliced into deployment.yaml
      # below, so anything trailing the tag would become extra deployment YAML.
      - name: Validate release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::not a publishable release tag: $VERSION"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # Resolved and validated before authenticating, so a configuration mistake
      # costs a few seconds and never touches the subscription.
      - name: Resolve and validate configuration
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
          AZURE_REGISTRY_SERVER: ${{ vars.AZURE_REGISTRY_SERVER }}
          AZURE_POSTGRES_HOST: ${{ vars.AZURE_POSTGRES_HOST }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME }}
          AZURE_ENVIRONMENT_DOMAIN: ${{ vars.AZURE_ENVIRONMENT_DOMAIN }}
          AZURE_IDENTITY_ID: ${{ vars.AZURE_IDENTITY_ID }}
          AZURE_KEY_VAULT_URL: ${{ vars.AZURE_KEY_VAULT_URL }}
          CARACAL_CONSOLE_HOST: ${{ vars.CARACAL_CONSOLE_HOST }}
          CARACAL_API_HOST: ${{ vars.CARACAL_API_HOST }}
          CARACAL_STS_HOST: ${{ vars.CARACAL_STS_HOST }}
          CARACAL_GATEWAY_HOST: ${{ vars.CARACAL_GATEWAY_HOST }}
        run: |
          set -euo pipefail
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs")
            const source = readFileSync(`deploy/azure/${process.env.ENVIRONMENT}.yaml`, "utf8")
            const missing = []
            const resolved = source
              .replace(/^(\s*version:).*$/m, `$1 ${process.env.VERSION.replace(/^v/, "")}`)
              .replace(/\$\{([A-Z0-9_]+)\}/g, (_, name) => {
                const value = process.env[name]
                if (!value) missing.push(name)
                return value ?? ""
              })
            if (missing.length > 0) {
              console.error(`missing environment variables: ${[...new Set(missing)].join(", ")}`)
              process.exit(1)
            }
            writeFileSync("deployment.yaml", resolved)
          '

      # Rendered once here purely to fail early on a bad configuration. The
      # manifests that are actually applied come from the release's own tooling.
      - name: Validate rendered manifests
        run: node infra/containerPlatform/render.mjs --config deployment.yaml --out preflight

      # Federated credentials only. A static client secret in CI is the exact
      # credential this deployment exists to avoid teaching.
      - name: Sign in to Azure
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The deployment tooling is taken from the release being deployed, not
      # from this checkout, so a redeploy of an older version uses that
      # version's tooling.
      - name: Fetch published deployment tooling
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" --repo "$REPOSITORY" \
            --pattern "caracal-deploy-${VERSION}.tar.gz" --pattern 'SHA256SUMS' --dir .
          grep " caracal-deploy-${VERSION}.tar.gz\$" SHA256SUMS | sha256sum --check --strict -

      # SHA256SUMS ships with the archive it describes, so it only proves the two
      # were published together. Provenance is the control that proves who built
      # them, and it runs before the archive is unpacked or its install scripts
      # execute against the signed-in subscription.
      - name: Verify release provenance
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: gh attestation verify "caracal-deploy-${VERSION}.tar.gz" --repo "$REPOSITORY"

      - name: Unpack deployment tooling
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "caracal-deploy-${VERSION}.tar.gz"
          npm --prefix caracal-deploy install --omit=dev --no-audit --no-fund

      - name: Import published images
        if: inputs.action == 'deploy'
        env:
          VERSION: ${{ inputs.version }}
          REGISTRY: ${{ vars.AZURE_REGISTRY_NAME }}
        run: |
          set -euo pipefail
          # Import, never rebuild: the digest deployed is the digest released.
          for image in caracal-go caracal-node caracal-web caracal-postgres; do
            az acr import --name "$REGISTRY" --force \
              --source "ghcr.io/garudex-labs/${image}:${VERSION}" \
              --image "${image}:${VERSION}"
          done

      - name: Render manifests
        run: node caracal-deploy/containerPlatform/render.mjs --config deployment.yaml --out rendered

      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          CARACAL_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: bash caracal-deploy/containerPlatform/scripts/deployAzure.sh rendered

      - name: Smoke test
        if: inputs.action == 'deploy' || inputs.action == 'verify'
        env:
          CARACAL_SMOKE_HOST: ${{ vars.CARACAL_SMOKE_HOST }}
        run: bash caracal-deploy/smokeTest.sh

      - name: Destroy
        if: inputs.action == 'destroy'
        env:
          CARACAL_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CARACAL_ASSUME_YES: '1'
        run: bash caracal-deploy/containerPlatform/scripts/destroyAzure.sh rendered

      # This step runs even when the tag validation above rejected the version, so
      # every dispatch input reaches it unchecked and must stay out of the script
      # body.
      - name: Report status
        if: always()
        env:
          CARACAL_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACTION: ${{ inputs.action }}
          VERSION: ${{ inputs.version }}
          ENVIRONMENT: ${{ inputs.environment }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Azure ${ACTION}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Target | ${ENVIRONMENT} |"
            echo "| Result | ${JOB_STATUS} |"
            echo ""
            az containerapp list --resource-group "$CARACAL_RESOURCE_GROUP" \
              --query "[].{app:name, revision:properties.latestReadyRevisionName, fqdn:properties.configuration.ingress.fqdn}" \
              -o table 2>/dev/null || echo "no container apps present"
          } >> "$GITHUB_STEP_SUMMARY"
