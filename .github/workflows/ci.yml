# ─────────────────────────────────────────────────────────────────────────────
# Caracal CI - runs on every PR and merge-queue candidate targeting main,
# and on pushes to main.
#
# Recommended branch-protection rules (Settings → Branches → main):
#   Required status checks:
#     • lint
#     • test (3.11)
#     • test (3.12)
#     • test (3.13)
#     • test (3.14)
#     • go-checks
#     • web-lint
#     • helm-lint
#     • docker-build
#     • dependency-audit
#     • repo-governance
#   Require a pull request before merging
#   Require approvals: 1
#   Do not allow bypassing the above settings
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Job 0: Path filtering ─────────────────────────────────────────────────────
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.filter.outputs.web }}
      docker: ${{ steps.filter.outputs.docker }}
      helm: ${{ steps.filter.outputs.helm }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # v4 compares merge-queue candidates using merge_group.base_sha/head_sha.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'apps/auth/**'
              - 'packages/pi-extension/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'packages/harness-data/**'
              - 'contracts/**'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            helm:
              - 'infra/helm/**'
              - 'docs/self-hosting/kubernetes-helm.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
            docker:
              - 'infra/docker/**'
              - 'apps/auth/**'
              - 'apps/web/**'
              - 'apps/web/package.json'
              - 'pnpm-lock.yaml'
              - '.env.example'
              - '.github/workflows/ci.yml'

# ── Job 1: Go build, lint, and tests ─────────────────────────
  go-checks:
    name: go-checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    steps:
      - name: Skip if no Go changes
        if: needs.changes.outputs.go != 'true'
        run: |
          echo "::notice::No Go changes detected, skipping go-checks"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.go == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod

      - name: gofmt
        if: needs.changes.outputs.go == 'true'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        if: needs.changes.outputs.go == 'true'
        run: go vet ./...

      - name: golangci-lint
        if: needs.changes.outputs.go == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0

      - name: go test
        if: needs.changes.outputs.go == 'true'
        run: >
          go test -race -covermode=atomic -coverprofile=coverage.out
          -coverpkg=./cmd/...,./internal/...,./packages/... ./...

      # Canonical repo only: forks have no Codecov token and must stay green.
      - name: Upload Go coverage to Codecov
        if: needs.changes.outputs.go == 'true' && github.repository == 'Garudex-Labs/caracal'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false


# ── Job 4: TypeScript lint, typecheck, and unit tests (web, auth, pi) ─────────
  web-lint:
    name: web-lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Skip if no web changes
        if: needs.changes.outputs.web != 'true'
        working-directory: .
        run: |
          echo "::notice::No web changes detected, skipping web-lint"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.web == 'true'

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: needs.changes.outputs.web == 'true'
        with:
          standalone: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: needs.changes.outputs.web == 'true'
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: ESLint
        if: needs.changes.outputs.web == 'true'
        run: pnpm run lint

      - name: TypeScript typecheck
        if: needs.changes.outputs.web == 'true'
        run: pnpm run typecheck

      - name: Unit tests
        if: needs.changes.outputs.web == 'true'
        run: pnpm run test:coverage

      # Canonical repo only: forks have no Codecov token and must stay green.
      - name: Upload web coverage to Codecov
        if: needs.changes.outputs.web == 'true' && github.repository == 'Garudex-Labs/caracal'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: apps/web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: auth typecheck
        if: needs.changes.outputs.web == 'true'
        working-directory: apps/auth
        run: pnpm run typecheck

      # pi-extension is published to npm on release but sits outside the pnpm
      # workspace, so it installs and tests against its own lockfile.
      - name: pi-extension typecheck + tests
        if: needs.changes.outputs.web == 'true'
        working-directory: packages/pi-extension
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run test

# ── Job 5: Helm chart lint ───────────────────────────────────────────────────
  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    steps:
      - name: Skip if no Helm changes
        if: needs.changes.outputs.helm != 'true'
        run: |
          echo "::notice::No Helm changes detected, skipping helm-lint"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.helm == 'true'

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: needs.changes.outputs.helm == 'true'

      - name: Lint chart
        if: needs.changes.outputs.helm == 'true'
        run: helm lint infra/helm/caracal

      - name: Render chart
        if: needs.changes.outputs.helm == 'true'
        run: |
          mkdir -p chart-dist
          helm template caracal infra/helm/caracal --namespace caracal > chart-dist/rendered.yaml

      - name: Validate rendered manifests
        if: needs.changes.outputs.helm == 'true'
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c \
            -strict \
            -summary \
            -kubernetes-version 1.27.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/c8f4e61c63bc529749125ac566bccc6986e08d45/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}{{.KindSuffix}}.json' \
            /work/chart-dist/rendered.yaml

      - name: Verify packaged chart appVersion image tags
        if: needs.changes.outputs.helm == 'true'
        run: |
          VERSION="1.2.3-test"
          mkdir -p chart-dist

          helm package infra/helm/caracal \
            --destination chart-dist \
            --version "$VERSION" \
            --app-version "$VERSION"
          helm template caracal "chart-dist/caracal-${VERSION}.tgz" \
            --namespace caracal > chart-dist/rendered.yaml

          SERVER_IMAGE_COUNT="$(grep -c "image: ghcr.io/garudex-labs/caracal-server:${VERSION}" chart-dist/rendered.yaml)"
          test "$SERVER_IMAGE_COUNT" -ge 2
          grep -q "image: ghcr.io/garudex-labs/caracal-web:${VERSION}" chart-dist/rendered.yaml
          grep -q "image: ghcr.io/garudex-labs/caracal-auth:${VERSION}" chart-dist/rendered.yaml

          helm template caracal "chart-dist/caracal-${VERSION}.tgz" \
            --namespace caracal \
            --set api.image.tag=custom-api \
            --set auth.image.tag=custom-auth \
            --set web.image.tag=custom-web > chart-dist/rendered-overrides.yaml

          grep -q "image: ghcr.io/garudex-labs/caracal-server:custom-api" chart-dist/rendered-overrides.yaml
          grep -q "image: ghcr.io/garudex-labs/caracal-web:custom-web" chart-dist/rendered-overrides.yaml
          grep -q "image: ghcr.io/garudex-labs/caracal-auth:custom-auth" chart-dist/rendered-overrides.yaml

# ── Job 6: Docker build ───────────────────────────────────────────────────────
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    defaults:
      run:
        working-directory: infra/docker

    steps:
      - name: Skip if no Docker changes
        if: needs.changes.outputs.docker != 'true'
        working-directory: .
        run: |
          echo "::notice::No Docker changes detected, skipping docker-build"
          echo "This job reports success to satisfy branch protection"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: needs.changes.outputs.docker == 'true'

      - name: Create stub .env
        if: needs.changes.outputs.docker == 'true'
        run: touch ../../.env

      - name: Build images
        if: needs.changes.outputs.docker == 'true'
        run: docker compose build

# ── Job 7: Dependency audit ─────────────────────────────────────────────────
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Audit Node and Go dependencies
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --lockfile=packages/pi-extension/pnpm-lock.yaml
            --lockfile=go.mod

# ── Job 8: Repository governance ─────────────────────────────────────────
  governance:
    name: repo-governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Required governance files
        run: |
          fail=0
          for f in README.md LICENSE.md NOTICE CHANGELOG.md SECURITY.md \
                   CODE_OF_CONDUCT.md CONTRIBUTING.md GOVERNANCE.md CLA.md \
                   AI_POLICY.md AGENTS.md SETUP.md .release.toml \
                   .github/CODEOWNERS .github/MAINTAINERS \
                   .github/pull_request_template.md; do
            if [ ! -s "$f" ]; then
              echo "::error file=$f::required governance file is missing or empty"
              fail=1
            fi
          done
          exit "$fail"

      - name: Code owners are listed maintainers
        run: |
          fail=0
          while read -r owner; do
            if ! grep -qiF "$owner" .github/MAINTAINERS; then
              echo "::error file=.github/CODEOWNERS::$owner is not listed in .github/MAINTAINERS"
              fail=1
            fi
          done < <(grep -v '^#' .github/CODEOWNERS | grep -hoE '@[A-Za-z0-9-]+' | sort -u)
          exit "$fail"

      - name: Project identifiers are consistent
        run: |
          grep -q '^module github.com/garudex-labs/caracal$' go.mod || {
            echo "::error file=go.mod::unexpected module path"
            exit 1
          }
          # Version files move together in release commits; drift on main means
          # a stray manual bump that the release preflight would reject later.
          python3 - <<'PY'
          import json, pathlib, sys, tomllib

          release = tomllib.loads(pathlib.Path(".release.toml").read_text())["version"]
          versions = {
              "apps/web/package.json": json.loads(pathlib.Path("apps/web/package.json").read_text())["version"],
              "packages/pi-extension/package.json": json.loads(
                  pathlib.Path("packages/pi-extension/package.json").read_text()
              )["version"],
          }
          drift = {path: found for path, found in versions.items() if found != release}
          if drift:
              sys.exit(f"version files disagree with .release.toml ({release}): {drift}")
          print(f"all version files agree with .release.toml: {release}")
          PY
