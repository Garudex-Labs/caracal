# Caracal, a product of Garudex Labs
#
# Validates the Caracal monorepo across TypeScript, Go, Python, and documentation builds.

name: test

on:
  push:
    branches:
      - main
  # Always emit the required status, including documentation-only PRs.
  pull_request:
  merge_group:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.1.1'
  BUN_VERSION: '1.3.14'
  GO_VERSION: '1.26'
  PYTHON_VERSION: '3.14'
  GOTOOLCHAIN: auto
  ASTRO_TELEMETRY_DISABLED: '1'
  CI: true

jobs:
  changes:
    name: Detect changes
    if: github.repository == 'Garudex-Labs/caracal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      typescript: ${{ steps.paths.outputs.typescript }}
      go: ${{ steps.paths.outputs.go }}
      python: ${{ steps.paths.outputs.python }}
      style: ${{ steps.paths.outputs.style }}
      docs: ${{ steps.paths.outputs.docs }}
      postgres: ${{ steps.paths.outputs.postgres }}
      helm: ${{ steps.paths.outputs.helm }}
      infra: ${{ steps.paths.outputs.infra }}
      workflows: ${{ steps.paths.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/ciChanges.mjs

  workflows:
    name: Workflow invariants
    needs: changes
    if: |
      always() && github.repository == 'Garudex-Labs/caracal' &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true') || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate workflow invariants
        run: node scripts/validateWorkflows.mjs

  style:
    name: Style checks
    needs: changes
    if: |
      always() && github.repository == 'Garudex-Labs/caracal' &&
      ((github.event_name == 'pull_request' && needs.changes.outputs.style == 'true') || github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/pythonStyleRequirements.lock

      - name: Verify repository toolchain contract
        run: node scripts/checkToolchain.mjs

      - name: Install style dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          python -m pip install --require-hashes --requirement scripts/pythonStyleRequirements.lock

      - name: Check changed source style
        if: github.event_name == 'pull_request'
        env:
          STYLE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run style

      - name: Check full source style
        if: github.event_name == 'push'
        run: pnpm run style --all

  typescript:
    name: TypeScript lint, types, tests, build
    needs: changes
    # Codecov project totals are comparable only when all language reports are
    # uploaded for every commit, including single-language pull requests.
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Generate runtime embedded assets
        run: pnpm --dir apps/runtime sync-embedded

      - name: Audit all npm dependencies
        run: |
          pnpm peers check
          pnpm audit --audit-level low

      - name: Build TypeScript packages
        run: pnpm run build:typescript

      - name: Build and smoke test runtime launcher
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Keep cross-platform compile checks on full runs; PRs exercise the
          # native launcher without rebuilding every workspace package twice.
          if [ "$EVENT_NAME" = pull_request ]; then
            pnpm --dir apps/runtime run stamp
            pnpm --dir apps/runtime run build:shell:linux-x64
          else
            pnpm --dir apps/runtime build
          fi
          apps/runtime/dist/caracal-linux-x64 --version
          apps/runtime/dist/caracal-linux-x64 --help

      - name: Verify SDK package exports
        run: node tests/typescript/contract/sdk/package-consumer.mjs

      - name: Run lint scripts
        run: pnpm run lint

      - name: Check for unused files, dependencies, and unresolved imports
        run: pnpm run knip

      - name: Run type checks
        run: pnpm -r --if-present typecheck

      - name: Run TypeScript tests and enforce coverage thresholds
        run: pnpm run test:coverage --coverage.reporter=lcov --coverage.reporter=text

      - name: List TypeScript coverage outputs
        if: always()
        shell: bash
        run: |
          echo 'Coverage tree:'
          ls -laR coverage/repository 2>&1 || echo 'coverage/repository missing'

      - name: Upload TypeScript coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-typescript
          path: coverage/repository/lcov.info
          if-no-files-found: error
          retention-days: 7

  go:
    name: Go tests
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod

      - name: Verify Go module integrity
        run: node scripts/runGoAudit.mjs --verify-only

      - name: Scan imported Go code for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          node scripts/runGoAudit.mjs

      - name: Go vet
        run: node scripts/runGoTests.mjs --vet

      - name: Run Go tests with coverage
        run: node scripts/runGoTests.mjs --coverage

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage/go/coverage.out
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python tests
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            packages/core/python/pyproject.toml
            packages/oauth/python/pyproject.toml
            packages/identity/python/pyproject.toml
            packages/revocation/python/pyproject.toml
            packages/sdk/python/pyproject.toml
            packages/verify/python/pyproject.toml
            packages/adapters/fastmcp/python/pyproject.toml
            packages/adapters/asgi/python/pyproject.toml
            packages/backends/redis/python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --requirement scripts/pythonTestRequirements.lock

      - name: Verify Python dependency constraints and hashes
        run: |
          python scripts/checkPythonDependencies.py
          python -m pip check

      - name: Run Python tests with coverage
        run: node scripts/runPythonTests.mjs --coverage -v

      - name: List Python coverage outputs
        if: always()
        shell: bash
        run: ls -la coverage/python 2>&1 || echo 'coverage/python missing'

      - name: Upload Python coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: coverage/python/coverage.xml
          if-no-files-found: error
          retention-days: 7

  docs:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build static docs
        env:
          DOCS_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD^' }}
        run: |
          node scripts/docsVersion.mjs verify --base "$DOCS_BASE_REF"
          pnpm --dir docs test
          node scripts/validateOpsDocs.mjs
          pnpm --dir docs build

      - name: Verify docs artifact
        run: |
          set -euo pipefail
          test -f docs/dist/index.html
          test -f docs/dist/CNAME
          grep -Fx 'docs.caracal.run' docs/dist/CNAME

  postgres:
    name: PostgreSQL migrations
    needs: changes
    if: needs.changes.outputs.postgres == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18@sha256:8ff36f3c66371cba71d20ceedccfc3de9669a68737607888c4ef0af93abe8e39
        env:
          POSTGRES_DB: caracal
          POSTGRES_USER: caracal
          POSTGRES_PASSWORD: caracal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caracal -d caracal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Validate migrations
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: caracal
          PGDATABASE: caracal
          PGPASSWORD: caracal
        run: bash infra/postgres/scripts/validateMigrations.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      # The boot-level API integration imports the Engine through buildApp(). The embedded
      # runtime asset is generated (and intentionally gitignored), so a clean PostgreSQL job
      # must create it just like the TypeScript build job does.
      - name: Generate Engine embedded runtime asset
        run: pnpm --filter @caracalai/engine sync-embedded

      - name: Apply migrations for integration tests
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/infra/postgres/migrations
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: caracal
          PGDATABASE: caracal
          PGPASSWORD: caracal
        run: bash infra/postgres/scripts/migrate.sh

      - name: Run schema integration tests
        env:
          CARACAL_TEST_DATABASE_URL: postgres://caracal:caracal@localhost:5432/caracal
        run: pnpm exec vitest run tests/typescript/integration

  helm:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Helm chart
        run: bash infra/helm/caracal/scripts/validate.sh

  helmInstall:
    name: Helm install
    needs: changes
    if: needs.changes.outputs.helm == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: caracal-verify-ci

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The chart and its dependency stores resolve every image from the chart
      # appVersion, and the tag for a version only reaches the registry when that
      # version is released. Building from the checkout exercises this commit and
      # keeps the install independent of what is already published. The runtime
      # image ships as a binary launcher and is never deployed by the chart.
      - name: Build and load images
        run: |
          set -euo pipefail
          tag="v$(grep '^appVersion:' infra/helm/caracal/Chart.yaml | cut -d: -f2 | tr -d ' "')"
          cluster="$(kind get clusters | head -1)"
          while IFS=$'\t' read -r name context dockerfile; do
            image="ghcr.io/garudex-labs/caracal-${name}:${tag}"
            docker buildx build "$context" \
              --file "$dockerfile" \
              --tag "$image" \
              --load \
              --cache-from "type=gha,scope=helm-${name}" \
              --cache-to "type=gha,mode=max,scope=helm-${name}"
            kind load docker-image "$image" --name "$cluster"
          done < <(jq -r '.product.containers[] | select(.name != "runtime") | [.name, .context, .dockerfile] | @tsv' release.config.json)

      # Generated per run and confined to a disposable cluster, so no credential
      # material is committed for the install test.
      - name: Generate test credentials
        run: |
          set -euo pipefail
          {
            echo "CARACAL_TEST_POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "CARACAL_TEST_REDIS_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"

      # Rendering proves a manifest is well formed. Only an install proves the
      # migration hook, the readiness probes, and the replay volume claims work.
      - name: Deploy chart dependencies
        run: |
          set -euo pipefail
          tag="v$(grep '^appVersion:' infra/helm/caracal/Chart.yaml | cut -d: -f2 | tr -d ' "')"
          kubectl create secret generic cluster-dependencies \
            --from-literal=postgresPassword="$CARACAL_TEST_POSTGRES_PASSWORD" \
            --from-literal=redisPassword="$CARACAL_TEST_REDIS_PASSWORD"
          sed "s|CARACAL_IMAGE_TAG|${tag}|g" infra/helm/caracal/scripts/clusterDependencies.yaml | kubectl apply -f -
          kubectl rollout status deployment/postgres --timeout=300s
          kubectl rollout status deployment/redis --timeout=300s

      - name: Install chart
        run: |
          set -euo pipefail
          # --wait-for-jobs blocks on the migration hook, and --wait blocks until
          # every workload reports Available, which requires /ready to succeed.
          #
          # Deliberately not --atomic here. Production installs should roll back,
          # but a rollback deletes the failed pods before anything can be read
          # from them, which is the whole point of running this in CI.
          #
          # Backgrounded so pod state prints while helm waits: otherwise a stuck
          # rollout is indistinguishable from a slow one until the timeout.
          helm upgrade --install caracal infra/helm/caracal \
            --namespace caracal --create-namespace \
            --values infra/helm/caracal/values.dev.yaml \
            --set secrets.create=true \
            --set migrations.activeDeadlineSeconds=300 \
            --set secrets.plaintext.postgresPassword="$CARACAL_TEST_POSTGRES_PASSWORD" \
            --set secrets.plaintext.redisPassword="$CARACAL_TEST_REDIS_PASSWORD" \
            --set secrets.plaintext.caracalAdminToken="$(openssl rand -hex 32)" \
            --set secrets.plaintext.caracalCoordinatorToken="$(openssl rand -hex 32)" \
            --set secrets.plaintext.caracalAuthSecret="$(openssl rand -hex 32)" \
            --set secrets.plaintext.metricsBearer="$(openssl rand -hex 32)" \
            --set secrets.plaintext.secretStoreKek="$(openssl rand -hex 32)" \
            --set secrets.plaintext.auditHmacKey="$(openssl rand -hex 32)" \
            --set secrets.plaintext.streamsHmacKey="$(openssl rand -hex 32)" \
            --set secrets.plaintext.idempotencyHmacKey="$(openssl rand -hex 32)" \
            --set secrets.plaintext.gatewayStsHmacKey="$(openssl rand -hex 32)" \
            --wait --wait-for-jobs --timeout 12m &
          helmPid=$!

          while kill -0 "$helmPid" 2>/dev/null; do
            sleep 20
            echo "--- $(date -u +%H:%M:%S) ---"
            kubectl -n caracal get pods --no-headers 2>/dev/null \
              | awk '{printf "  %-44s %-8s %-24s restarts=%s\n", $1, $2, $3, $4}' || true
            kubectl -n caracal get events --field-selector type=Warning \
              -o custom-columns=OBJ:.involvedObject.name,MSG:.message --no-headers 2>/dev/null \
              | tail -3 | sed 's/^/  warn: /' || true
          done

          wait "$helmPid"

      - name: Verify workloads
        run: |
          set -euo pipefail
          kubectl -n caracal get pods -o wide
          for name in sts gateway api audit coordinator web; do
            kubectl -n caracal rollout status "$(kubectl -n caracal get deploy,statefulset \
              -l app.kubernetes.io/component=${name} -o name | head -1)" --timeout=60s
          done
          # STS and Gateway carry replay volumes, so they must install as StatefulSets.
          kubectl -n caracal get statefulset caracal-caracal-sts caracal-caracal-gateway

      - name: Setup pnpm for contract clients
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node for contract clients
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build contract clients
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm run build:typescript

      - name: Exercise Helm distributed contracts and upgrades
        env:
          CARACAL_VERIFY_DISPOSABLE: yes
        run: bash infra/helm/caracal/scripts/verifyInstall.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "::group::pods"
          kubectl -n caracal get pods -o wide || true
          echo "::endgroup::"
          echo "::group::not-ready containers"
          # A container that never started has no logs, so its waiting reason is
          # the only signal available.
          kubectl -n caracal get pods -o json 2>/dev/null | node -e '
            let raw = ""
            process.stdin.on("data", (c) => (raw += c)).on("end", () => {
              for (const pod of (JSON.parse(raw || "{}").items ?? [])) {
                for (const s of pod.status.containerStatuses ?? []) {
                  if (s.ready) continue
                  const state = Object.entries(s.state ?? {})[0] ?? ["unknown", {}]
                  console.log(`${pod.metadata.name}/${s.name}: ${state[0]} ${state[1].reason ?? ""} ${state[1].message ?? ""}`)
                }
              }
            })
          ' || true
          echo "::endgroup::"
          echo "::group::warning events"
          kubectl -n caracal get events --field-selector type=Warning --sort-by=.lastTimestamp | tail -40 || true
          echo "::endgroup::"
          echo "::group::migration job"
          kubectl -n caracal logs job/caracal-caracal-migrate --tail=100 || true
          kubectl -n caracal describe job caracal-caracal-migrate || true
          echo "::endgroup::"
          echo "::group::service logs"
          kubectl -n caracal logs -l app.kubernetes.io/part-of=caracal --tail=60 --all-containers --prefix || true
          echo "::endgroup::"
          echo "::group::dependencies"
          kubectl get pods -o wide || true
          kubectl logs deployment/postgres --tail=40 || true
          kubectl logs deployment/redis --tail=40 || true
          echo "::endgroup::"

  infra:
    name: Infrastructure validation
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck infra scripts
        run: shellcheck infra/scripts/*.sh infra/tofu/scripts/*.sh infra/redis/*.sh infra/postgres/scripts/*.sh infra/helm/caracal/scripts/*.sh infra/containerPlatform/scripts/*.sh

      - name: Validate compose files
        env:
          CARACAL_VERSION: 0.0.0
        run: |
          docker compose -f infra/docker/docker-compose.yml config --quiet
          docker compose -f infra/docker/runtime-compose.yml config --quiet

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Validate container platform manifests
        run: bash infra/containerPlatform/scripts/validate.sh

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.5

      - name: Validate OpenTofu configuration
        run: bash infra/tofu/scripts/validate.sh

  e2e:
    name: Stack end-to-end
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.typescript == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARACAL_SECRETS_DIR: ${{ github.workspace }}/.caracal/e2e-secrets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.work
            go.work.sum
            **/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify isolated deployments and recovery
        run: |
          pnpm run build:typescript
          node infra/scripts/verifyDeployment.mjs --go-contracts --image-tag verify-local --report .caracal/deployment-source.json
          node infra/scripts/verifyDeployment.mjs --mode runtime --skip-build --image-tag verify-local --report .caracal/deployment-runtime.json

      - name: Upload deployment verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-verification
          path: .caracal/deployment-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  releaseConfig:
    name: Release config drift
    if: github.repository == 'Garudex-Labs/caracal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify version pins
        run: node scripts/release.mjs stamp --check

  coverage:
    name: Upload coverage
    needs:
      - typescript
      - go
      - python
    # Never publish a partial project report when a language job fails/skips.
    if: always() && !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.typescript.result == 'success' && needs.go.result == 'success' && needs.python.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage

      - name: List coverage files
        run: find coverage -maxdepth 4 -type f -print | sort

      - name: Verify all language reports before uploading
        shell: bash
        run: |
          test -s coverage/coverage-go/coverage.out
          test -s coverage/coverage-python/coverage.xml
          test "$(find coverage/coverage-typescript -name lcov.info -type f -size +0c | wc -l)" -gt 0

      # The action's default bootstrap downloads from cli.codecov.io. That
      # endpoint can fail its TLS handshake before any report is processed.
      # Use Codecov's official GitHub release asset instead, with the release's
      # pinned SHA-256 verified here (the action skips its own verification for
      # a pre-downloaded binary). Do not disable fail_ci_if_error below.
      - name: Download and verify Codecov CLI
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 --proto '=https' --proto-redir '=https' \
            'https://github.com/codecov/codecov-cli/releases/download/v11.3.1/codecovcli_linux' \
            --output '${{ runner.temp }}/codecov'
          echo 'ca1d64196d2d34771084afe76ea657d581bf628e31d993ff8e52ea09cc88a56d  ${{ runner.temp }}/codecov' | sha256sum --check --status
          chmod 0755 '${{ runner.temp }}/codecov'
          '${{ runner.temp }}/codecov' --version

      - name: Upload TypeScript coverage to Codecov
        if: needs.typescript.result == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage/coverage-typescript
          flags: typescript
          fail_ci_if_error: true

      - name: Upload Go coverage to Codecov
        if: needs.go.result == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-go/coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Python coverage to Codecov
        if: needs.python.result == 'success'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          binary: ${{ runner.temp }}/codecov
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage-python/coverage.xml
          flags: python
          disable_search: true
          fail_ci_if_error: true

  status:
    name: Test status
    needs:
      - changes
      - style
      - typescript
      - go
      - python
      - docs
      - postgres
      - helm
      - helmInstall
      - workflows
      - infra
      - e2e
      - releaseConfig
      - coverage
    if: always() && github.repository == 'Garudex-Labs/caracal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        shell: bash
        env:
          JOB_RESULTS: >-
            ${{ needs.changes.result }} ${{ needs.style.result }}
            ${{ needs.typescript.result }} ${{ needs.go.result }} ${{ needs.python.result }}
            ${{ needs.docs.result }} ${{ needs.postgres.result }} ${{ needs.helm.result }} ${{ needs.helmInstall.result }} ${{ needs.workflows.result }}
            ${{ needs.infra.result }} ${{ needs.e2e.result }} ${{ needs.releaseConfig.result }}
            ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          for result in $JOB_RESULTS; do
            if [[ "$result" == 'failure' || "$result" == 'cancelled' ]]; then
              echo "A required test workflow job ended with $result."
              exit 1
            fi
          done
          echo 'All required test workflow jobs passed or were skipped.'
