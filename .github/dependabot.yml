# Automated dependency update cadence across every Caracal ecosystem.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    ignore:
      # typescript-eslint parses source with the JavaScript TypeScript API,
      # which the native TypeScript 7 package no longer exposes.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production

  - package-ecosystem: gomod
    directories:
      - /infra/healthcheck
      - /infra/postgres/gosu
      - /packages/**/go
      - /services/*
      - /tests/go
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: pip
    directories:
      - /packages/**/python
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      pip:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directories:
      - /infra/tofu/envs/*
      - /infra/tofu/modules/*
      - /infra/tofu/providers/*/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      terraform:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /apps/runtime
      - /infra/docker
      - /infra/postgres
      - /infra/redis
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      docker:
        patterns:
          - "*"
