# The same distroless base ships glibc (libc6) 2.36-9+deb12u13; the CVEs below are
# fixed in 2.36-9+deb12u14. Node dynamically links libc.so.6, but these paths are
# reached only through hostile input Caracal does not expose: crafted responses
# from an untrusted DNS resolver (Caracal uses the trusted cluster resolver),
# iconv() with attacker-chosen charsets, wordexp(), or attacker-chosen allocation
# alignment. Remediation needs the upstream distroless rebuild - the :nonroot tag
# resolves to our pinned digest and distroless has no package manager.
  - id: CVE-2026-0915
    statement: "libc6 resolver info disclosure; not reachable via Caracal's trusted-cluster DNS. Fix in deb12u14 pending distroless rebuild; no newer digest, no in-image package manager."
    expired_at: 2026-08-25
  - id: CVE-2026-4046
    statement: "libc6 iconv() DoS needs an attacker-chosen charset Caracal never passes. Fix in deb12u14 pending distroless rebuild; no newer digest, no in-image package manager."
    expired_at: 2026-08-25
  - id: CVE-2026-4437
    statement: "libc6 crafted DNS response parsing; not reachable via Caracal's trusted-cluster DNS resolver. Fix in deb12u14 pending distroless rebuild; no newer digest, no in-image package manager."
    expired_at: 2026-08-25
  - id: CVE-2025-15281
    statement: "libc6 wordexp() path is unused by the Node services. Fix in deb12u14 pending distroless rebuild; no newer digest, no in-image package manager."
    expired_at: 2026-08-25
  - id: CVE-2026-0861
    statement: "libc6 memalign integer overflow needs an attacker-controlled allocation alignment Caracal never supplies. Fix in deb12u14 pending distroless rebuild; no newer digest, no in-image package manager."
    expired_at: 2026-08-25
  - id: CVE-2026-4438
    statement: "libc6 gethostbyaddr legacy reverse-DNS API is unused; trusted-cluster DNS. Fix in deb12u14 pending distroless rebuild; no newer digest, no in-image package manager."
    expired_at: 2026-08-25

# The postgres:18-alpine base image ships gosu built against golang.org/x/sys
# v0.1.0. CVE-2026-39824 is in the x/sys windows package (NewNTUnicodeString),
# which is not compiled into the linux/amd64 gosu binary, so the finding is not
# reachable on this platform. Remediation requires an upstream gosu rebuild.
  - id: CVE-2026-39824
    statement: "Windows-only x/sys code path in upstream gosu inside postgres:18-alpine; unreachable in linux/amd64 builds."
    expired_at: 2026-08-25

# The same postgres:18-alpine gosu binary is flagged for CVE-2026-39822, the Go
# standard library os.Root symlink-traversal bug. gosu drops privileges and
# execs; it never opens files through os.Root, so the vulnerable API is not
# reachable in the binary. gosu is third-party and cannot be remediated by
# pinning; it needs an upstream rebuild on Go 1.26.5+. Caracal's own Go images
# already build on the patched 1.26.5 toolchain.
  - id: CVE-2026-39822
    statement: "os.Root API unused by upstream gosu inside postgres:18-alpine; unreachable, and the third-party binary cannot be remediated by pinning."
    expired_at: 2026-08-11

# The same gosu binary is flagged for CVE-2026-42505, a crypto/tls Encrypted
# Client Hello information disclosure. gosu performs no network or TLS I/O - it
# resolves a user, drops privileges, and execs the target process - so the
# crypto/tls handshake path is never invoked. Third-party binary; needs an
# upstream rebuild on Go 1.26.5+, which Caracal's own Go images already use.
  - id: CVE-2026-42505
    statement: "gosu inside postgres:18-alpine performs no TLS I/O; the crypto/tls Encrypted Client Hello path is unreachable, and the third-party binary cannot be remediated by pinning."
    expired_at: 2026-08-11

# postgres:18-alpine bundles gosu v1.19.0 built with Go 1.24.6. Trivy flags
# stdlib CVEs by compiler version, but the corresponding packages are absent
# from gosu's dependency graph (github.com/tianon/gosu v1.19.0 imports only
# the user/privilege-switching dependencies). Limit these exceptions to the
# gosu binary: Caracal's own Go service binaries must remain fully scanned.
# Recheck the upstream gosu binary and these package paths by 2026-11-05.
  - id: CVE-2026-56862
    paths: ["usr/local/bin/gosu"]
    statement: "gosu does not import crypto/tls or perform TLS handshakes; KeyUpdate is unreachable. Review upstream gosu at expiry."
    expired_at: 2026-11-05
  - id: CVE-2026-56860
    paths: ["usr/local/bin/gosu"]
    statement: "gosu does not import net/url; path resolution is absent from this executable. Review upstream gosu at expiry."
    expired_at: 2026-11-05
  - id: CVE-2026-56859
    paths: ["usr/local/bin/gosu"]
    statement: "gosu does not import encoding/xml; XML decoding is absent from this executable. Review upstream gosu at expiry."
    expired_at: 2026-11-05
  - id: CVE-2026-56858
    paths: ["usr/local/bin/gosu"]
    statement: "gosu does not import html/template; template rendering is absent from this executable. Review upstream gosu at expiry."
    expired_at: 2026-11-05
  - id: CVE-2026-56853
    paths: ["usr/local/bin/gosu"]
    statement: "gosu does not import net/http; HTTP/2 processing is absent from this executable. Review upstream gosu at expiry."
    expired_at: 2026-11-05
  - id: CVE-2026-39821
    paths: ["usr/local/bin/gosu"]
    statement: "gosu does not import golang.org/x/net/idna or net/http; IDNA hostname processing is absent. Review upstream gosu at expiry."
    expired_at: 2026-11-05
  - id: CVE-2026-33818
    paths: ["usr/local/bin/gosu"]
    statement: "gosu does not import encoding/asn1; ASN.1 parsing is absent from this executable. Review upstream gosu at expiry."
    expired_at: 2026-11-05

# The postgres:18-alpine base image carries c-ares as a transitive dependency.
# CVE-2026-33630 is a use-after-free reachable only through ares_getaddrinfo()
# over TCP against an attacker-controlled DNS responder. Caracal's postgres
# container resolves through the trusted cluster resolver and is not exposed to
# hostile DNS responses. The image already runs `apk upgrade`, so the next
# rebuild adopts c-ares 1.34.8-r0 automatically once Alpine publishes it.
  - id: CVE-2026-33630
    statement: "postgres c-ares not exposed to untrusted DNS responders in Caracal; apk upgrade adopts 1.34.8-r0 on rebuild once Alpine publishes it."
    expired_at: 2026-08-11
