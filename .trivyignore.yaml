# Time-boxed Trivy suppressions for upstream-pending base image CVEs that Caracal cannot remediate by pinning.

# The gcr.io/distroless/nodejs24-debian12:nonroot runtime base ships libssl3
# 3.0.18-1~deb12u2, so it carries every libssl3 CVE below (fixed upstream in
# 3.0.19-1~deb12u2 / 3.0.20-1~deb12u2). Node links its own statically-compiled
# OpenSSL 3.5.5; the node binary has no NEEDED entry for libssl.so.3 or
# libcrypto.so.3, so the api, coordinator, and web BFF never load the system
# libssl3 and none of these findings are reachable at runtime. The fix requires
# an upstream distroless rebuild: the :nonroot tag still resolves to our pinned
# digest, and distroless ships no package manager to upgrade in place. These
# entries expire so the findings resurface once the base image is rebuilt.
vulnerabilities:
  - id: CVE-2026-31789
    statement: "Heap overflow affects 32-bit builds only; Caracal publishes linux/amd64 and linux/arm64. System libssl3 is also not linked by Node (bundled OpenSSL 3.5.5). Fix pending distroless rebuild; no newer digest, no in-image package manager."
    expired_at: 2026-08-25
  - id: CVE-2026-28387
    statement: "System libssl3 not linked by Node (bundled OpenSSL 3.5.5); unreachable. Fix pending distroless rebuild; no newer digest, no in-image package manager."
    expired_at: 2026-08-25
